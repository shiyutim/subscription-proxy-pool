[package]
name = "subscription-proxy-pool"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Subscription-backed HTTP and SOCKS proxy pools with caching, health checks, and request-count or time-based rotation"
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/subscription-proxy-pool"
repository = "https://github.com/shiyutim/subscription-proxy-pool"
keywords = ["proxy", "subscription", "rotation", "reqwest", "clash"]
categories = ["network-programming", "asynchronous"]
include = ["src/**", "tests/**", "examples/**", "Cargo.toml", "Cargo.lock", "README.md", "README.zh-CN.md", "PUBLISHING.md", "LICENSE", "CHANGELOG.md"]

[dependencies]
base64 = "0.22"
futures-util = "0.3"
hyper = { version = "1", default-features = false }
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "socks", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "1", default-features = false, features = ["deserialize"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time"] }
url = "2.5"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "test-util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
await_holding_lock = "deny"
